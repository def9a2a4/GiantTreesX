name: ${project.name}
description: ${project.description}
author: def9a2a4
contributors: [Ryan Michela, Ronald Jack Jenkins Jr., Capri205]
website: https://github.com/def9a2a4/GiantTreesX
version: "${project.version}"
api-version: ${api-version}
main: io.github.def9a2a4.gianttreesx.TreePlugin
load: STARTUP

commands:
   tree-edit:
      description: Opens the giant tree editor. Can only be called from the server console.
      usage: "Usage: tree-edit species"
   tree-create:
      description: Creates a giant tree.
      aliases: gt
      permission: gianttrees.create
      usage: "Usage: /<command> <species> [<world> <x> <z>]"

permissions:
   gianttrees.create:
      description: Allows the creation of a giant tree using the tree-create command.
      default: op
   gianttrees.grow:
      description: Allows a player to grow a giant tree by fertilizing a grid of saplings.
      default: true
