name: ${project.name}
description: ${project.description}
author: def9a2a4
contributors: [Ryan Michela, Ronald Jack Jenkins Jr., Capri205]
website: https://github.com/def9a2a4/GiantTreesX
version: "${project.version}"
api-version: ${api-version}
main: io.github.def9a2a4.gianttreesx.TreePlugin
load: STARTUP

commands:
   gianttrees:
      description: Grow giant trees, and help and links for GiantTreesX.
      aliases: [gt]
      usage: "Usage: /<command> help"

permissions:
   gianttrees.create:
      description: Allows growing a giant tree with /gianttrees grow.
      default: op
   gianttrees.grow:
      description: Allows a player to grow a giant tree by fertilizing a grid of saplings.
      default: true
