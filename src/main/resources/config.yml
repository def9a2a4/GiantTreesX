    - MMMMM
    - MMXMM
    - MMMMM
    - MMMMM
  mesapuzzle:
    - AAAAA
    - AOOOA
    - AOXOA
    - AOOOA
    - AAAAA
  cottonwood:
    - BOOOB
    - OBOBO
    - OOXOO
    - OBOBO
    - BOOOB
  pale_oak:
