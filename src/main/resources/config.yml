# By default, Giant Trees only creates trees when you ask it to. To enable automatic
# generation of trees in your world as new chunks are generated, set naturallyGrowTrees
# to true
naturallyGrowTrees: true
treeGrowthPercentChance: 0.5

# The worlds list below is only used when naturallyGrowTrees is set to true
worlds:
  - world

# The planting pattern is used to grow giant trees in survival mode using collected resources.
planting-patterns:
  # A 5 x 5 matrix is used for the pattern with the core block in the center
  # Each row in the pattern represents one row of blocks placed horizontally on the ground.
  # All rows must be the same length (5x5 matrix)
  # Each character in the pattern represents one of the following saplings:
  # A=Acacia, O=Oak, D=Dark Oak, B=Birch, C=Cherry, M=Mangrove Propaglue, S=Spruce, J=Jungle, and X for core.
  acacia:
    - AAAAA
    - AAAAA
    - AAXAA
    - AAAAA
    - AAAAA
  oak:
    - OOOOO
    - OOOOO
    - OOXOO
    - OOOOO
    - OOOOO
  birch:
    - BBBBB
    - BBBBB
    - BBXBB
    - BBBBB
    - BBBBB
  cherry:
    - CCCCC
    - CCCCC
    - CCXCC
    - CCCCC
    - CCCCC
  dark_oak:
    - DDDDD
    - DDDDD
    - DDXDD
    - DDDDD
    - DDDDD
  spruce:
    - SSSSS
    - SSSSS
    - SSXSS
    - SSSSS
    - SSSSS
  jungle:
    - JJJJJ
    - JJJJJ
    - JJXJJ
    - JJJJJ
    - JJJJJ
  mangrove:
    - MMMMM
    - MMMMM
    - MMXMM
    - MMMMM
    - MMMMM
  mesapuzzle:
    - AAAAA
    - AOOOA
    - AOXOA
    - AOOOA
    - AAAAA
  cottonwood:
    - BOOOB
    - OBOBO
    - OOXOO
    - OBOBO
    - BOOOB

# core block (marked by X in patterns)
core: EMERALD_BLOCK

# Fertilizing the tree consumes some number of bone meal.
bone-meal-consumed: 64
  
# Giant trees can possibly smother players if they don't get out of the way.
# How many seconds should Giant Trees wait before adding a tree to the world?
generation-delay: 3

# verbose-logging: true

# How tree wood and leaves are turned into blocks.
wood:
  # all_log:        every wood block is a log (the look before GiantTrees 4.0)
  # mixed:          wood blocks (bark on all sides) on the outside, logs in the core
  # mixed_stripped: wood blocks on the outside, stripped logs in the core
  style: mixed
  # Percent chance (0-100) that a tree's trunk is hollow above the ground.
  hollow_chance: 0
  # Blocks of wall, bark included, left around a hollow trunk.
  hollow_wall_thickness: 2

# Per wood type overrides, keyed by the WoodType of the tree file:
# Oak, Spruce, Birch, Cherry, Jungle, Acacia, Dark Oak, Mangrove, Mangrove_roots.
# Any key from the wood section can be overridden, and "leaves" sets a weighted mix of
# leaf blocks (default: the wood type's own leaves).
wood_types: {}
  # Oak:
  #   hollow_chance: 10
  #   leaves:
  #     OAK_LEAVES: 9
  #     FLOWERING_AZALEA_LEAVES: 1
  # Dark Oak:
  #   style: mixed_stripped
  #   hollow_chance: 25

# Trees never replace blocks with block entities (chests, spawners, signs, ...) or the blocks
# listed below.
protect_block_entities: true
protected_blocks:
  - BEDROCK
  - BARRIER
  - END_PORTAL_FRAME
  - END_PORTAL
  - NETHER_PORTAL
  - REINFORCED_DEEPSLATE

# Only change the settings below if you are having lag problems
BLOCKS_PER_TICK: 1500       # The number of blocks to place in a single tick
TICK_DELAY: 1               # The delay in ticks between batches of blocks