    # 3 x 3 rings around a big tree's core (a bone block by default): big trees. The same rings
    # as the huge trees above, which have an emerald block in the middle.
    # Jungle and spruce have no big tree: vanilla's 2 x 2 jungle and spruce trees fill that size.
    acacia_big:
      - AAA
