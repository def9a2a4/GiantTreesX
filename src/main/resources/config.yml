# By default, Giant Trees only creates trees when you ask it to. To enable automatic
# generation of trees in your world as new chunks are generated, set naturallyGrowTrees
# to true
naturallyGrowTrees: true
treeGrowthPercentChance: 0.5

# The worlds list below is only used when naturallyGrowTrees is set to true
worlds:
  - world

# How often each biome tree is picked when a tree grows naturally. Every biome.<BIOME>-<name>.xml
# file in the plugin folder is a candidate for its biome; <name> is the key here. A key starting
# with * matches every name ending in the rest, so "*_SMALL" covers OAK_SMALL, SPRUCE_SMALL, ...
# An exact name beats a * key. Trees not listed weigh "default". 0 stops a tree spawning.
# With the weights below a forest gets 3 small oaks for every giant oak. treeGrowthPercentChance
# still decides how often a tree grows at all.
natural-tree-weights:
  default: 1
  "*_SMALL": 3

# The planting pattern is used to grow giant trees in survival mode using collected resources.
planting-patterns:
  # A 5 x 5 pattern grows a giant tree, a 3 x 3 pattern a small one (it costs
  # bone-meal-consumed-small instead of bone-meal-consumed). The core block is in the center.
  # When both a 5 x 5 and a 3 x 3 pattern fit around the core block, the 5 x 5 one wins.
  # The name of a pattern is the tree file it grows: oak_small grows tree.OAK_SMALL.xml.
  # Each row in the pattern represents one row of blocks placed horizontally on the ground.
  # All rows must be as long as there are rows (a square).
  # Each character in the pattern represents one of the following saplings:
  # A=Acacia, O=Oak, D=Dark Oak, B=Birch, C=Cherry, M=Mangrove Propaglue, S=Spruce, J=Jungle,
  # P=Pale Oak, L=Poplar (Minecraft 26.3+), R=Red Mushroom, N=Brown Mushroom, F=Crimson Fungus,
  # W=Warped Fungus, Z=Azalea, Y=Flowering Azalea, H=Blue Orchid, and X for core.
  # Patterns using a sapling the server doesn't have (e.g. poplar before 26.3) are skipped.
  acacia:
    - AAAAA
    - AAAAA
    - AAXAA
    - AAAAA
    - AAAAA
  oak:
    - OOOOO
    - OOOOO
    - OOXOO
    - OOOOO
    - OOOOO
  birch:
    - BBBBB
    - BBBBB
    - BBXBB
    - BBBBB
    - BBBBB
  cherry:
    - CCCCC
    - CCCCC
    - CCXCC
    - CCCCC
    - CCCCC
  dark_oak:
