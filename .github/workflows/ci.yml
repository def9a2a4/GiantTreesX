name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Build
        run: make build

      # paper-api is `provided`; if it ever leaks back into the shaded jar, fail loudly.
      - name: Check the jar bundles no server API
        run: |
          jar=$(ls target/GiantTrees-*.jar | grep -v original)
          if unzip -l "$jar" | grep -E ' (org/bukkit|io/papermc|net/kyori|com/google)/'; then
            echo "server API classes were shaded into $jar"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: GiantTrees
          path: target/GiantTrees-*.jar
          if-no-files-found: error

  server-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21.11', '26.3']
    name: paper ${{ matrix.minecraft }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ startsWith(matrix.minecraft, '26.') && '25' || '21' }}

      - uses: actions/download-artifact@v4
        with:
          name: GiantTrees
          path: target/

      - name: Server test
        run: make server-test MINECRAFT_VERSION=${{ matrix.minecraft }}

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs-${{ matrix.minecraft }}
          path: |
            test-server/ci-${{ matrix.minecraft }}/*.log
            test-server/ci-${{ matrix.minecraft }}/logs/
          if-no-files-found: ignore
