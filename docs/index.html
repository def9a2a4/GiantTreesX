<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GiantTrees Gallery</title>
<style>
  :root {
    --bg: #14181d; --panel: #1c2229; --line: #2c343d; --text: #d8dee5; --muted: #8b96a3; --accent: #7cc36b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  header { padding: 28px 16px 8px; max-width: 1200px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 26px; font-weight: 650; }
  h1 span { color: var(--accent); }
  header p { margin: 4px 0; color: var(--muted); }
  a { color: var(--accent); }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; display: grid; gap: 20px;
         grid-template-columns: repeat(auto-fill, minmax(min(100%, 540px), 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
          display: grid; grid-template-columns: 12fr 5fr; }
  /* the hero (4:5) is exactly as tall as three square views next to it, so nothing is cropped */
  .card a.img { display: block; position: relative; background: #8eb4d6; }
  .card img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .card a.img:hover img { filter: brightness(1.08); }
  .hero { grid-row: span 3; }
  .small { border-left: 1px solid var(--line); aspect-ratio: 1; }
  .small + .small { border-top: 1px solid var(--line); }
  .cap { position: absolute; left: 6px; bottom: 6px; padding: 1px 7px; border-radius: 4px; font-size: 12px;
         background: rgba(10, 14, 18, 0.72); color: var(--text); }
  .meta { grid-column: 1 / -1; padding: 10px 14px 12px; border-top: 1px solid var(--line); }
  .meta h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .meta h2 a { color: var(--text); text-decoration: none; }
  .meta h2 a:hover { color: var(--accent); }
  .meta p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  #status { color: var(--muted); padding: 0 16px; max-width: 1200px; margin: 0 auto; }
</style>
</head>
<body>
<header>
  <h1>GiantTrees <span>gallery</span></h1>
  <p>Every tree the plugin ships, as blocks. Click any picture to open that tree in the
     <a href="viewer/">viewer</a>, where you can turn it around, cut into it and edit its config.</p>
  <p><a href="https://github.com/def9a2a4/GiantTreesX">GiantTreesX on GitHub</a></p>
</header>
<div id="status">Loading…</div>
<main id="gallery"></main>
<script type="module">
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const status = document.getElementById('status');
  try {
    const r = await fetch('gallery/gallery.json');
    if (!r.ok) throw new Error(`gallery/gallery.json: HTTP ${r.status} (run make gallery)`);
    const { trees } = await r.json();
    const img = (t, im, cls) => `<a class="img ${cls}" href="${esc(t.viewer)}" title="Open ${esc(t.name)} in the viewer">
        <img src="${esc(im.src)}" alt="${esc(t.name)}: ${esc(im.caption)}" loading="lazy">
        ${cls === 'hero' ? '' : `<span class="cap">${esc(im.caption)}</span>`}</a>`;
    document.getElementById('gallery').innerHTML = trees.map((t) => `
      <article class="card">
        ${img(t, t.images.hero, 'hero')}
        ${img(t, t.images.cut, 'small')}
        ${img(t, t.images.top, 'small')}
        ${img(t, t.images.base, 'small')}
        <div class="meta">
          <h2><a href="${esc(t.viewer)}">${esc(t.name)}</a></h2>
          <p>${esc(t.woodType)} · ${t.height} blocks tall · ${t.width} wide · ${t.blocks.toLocaleString()} blocks · seed ${t.seed}
             ${t.aliases.length ? `<br>Also used as ${t.aliases.map(esc).join(', ')}` : ''}</p>
        </div>
      </article>`).join('');
    status.remove();
  } catch (e) {
    status.textContent = 'Could not load the gallery: ' + e.message;
  }
</script>
</body>
</html>
